name: Build nut_webgui for Astra Linux

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'nut_webgui/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Makefile'
      - 'makefiles/**'
      - 'configure.sh'
      - '.github/workflows/build-musl.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            musl-tools \
            make \
            jq \
            nodejs \
            npm

      - name: Diagnose and install npm dependencies
        working-directory: crates/nut_webgui_client
        run: |
          node --version
          npm --version
          npm install --legacy-peer-deps

      - name: Build musl binary
        env:
          npm_config_legacy_peer_deps: "true"
        run: |
          make help
          make build-all TARGETS=x86-64-musl ENABLE_X86_64_MUSL=1

      - name: Verify binary
        run: |
          file bin/artifact/x86-64-musl/nut_webgui
          readelf -l bin/artifact/x86-64-musl/nut_webgui
          if readelf -l bin/artifact/x86-64-musl/nut_webgui | grep -q 'INTERP'; then
            echo "ERROR: binary has a dynamic interpreter"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nut-webgui-x86-64-musl
          path: bin/artifact/x86-64-musl/nut_webgui
          if-no-files-found: error
          retention-days: 7
